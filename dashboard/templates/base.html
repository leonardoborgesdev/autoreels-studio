<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Cole um link (repositório do GitHub ou qualquer site) e gere um reel vertical pronto pra postar: roteiro por IA, captura de tela automática, avatar clonado, legenda karaokê e música de fundo.">
<meta property="og:title" content="AutoReels Studio">
<meta property="og:description" content="Cole um link e gere um reel vertical pronto pra postar, com roteiro por IA, captura de tela automática, avatar clonado e legenda karaokê.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b0e0c">
<script>
  (function () {
    var t = localStorage.getItem('autoreels-theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<title>{% block title %}AutoReels Studio — reels prontos a partir de um link{% endblock %}</title>
<style>
  :root {
    --bg: #0b0e0c;
    --surface: #12161320;
    --surface-solid: #141816;
    --surface-raised: #181d1a;
    --surface-sunken: #0e1210;
    --border: #232a25;
    --border-soft: #1b201d;
    --text: #e6ece7;
    --text-dim: #8a958c;
    --text-faint: #5b655d;
    --accent: #38e07b;
    --accent-dim: #1d5c38;
    --accent-soft: rgba(56, 224, 123, .1);
    --danger: #ff6b6b;
    --danger-dim: #5c2626;
    --warn: #ffb347;
    --warn-dim: #6b4a1a;
    --busy: #ffd93d;
    --busy-dim: #6b6020;
    --accent2: #58a6ff;
    --accent2-dim: #1c3a5c;

    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-pill: 999px;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
    --shadow-md: 0 8px 24px -8px rgba(0,0,0,.55);
    --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.65);

    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI",
      ui-sans-serif, system-ui, Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }

  :root[data-theme="light"] {
    --header-bg: rgba(255, 255, 255, .82);
    --bg: #f5f7f4;
    --surface: #ffffff20;
    --surface-solid: #ffffff;
    --surface-raised: #ffffff;
    --surface-sunken: #eef1ec;
    --border: #dde3d9;
    --border-soft: #e6ebe3;
    --text: #16201a;
    --text-dim: #56635a;
    --text-faint: #8a9689;
    --accent: #1d9a54;
    --accent-dim: #bfe8d1;
    --accent-soft: rgba(29, 154, 84, .1);
    --danger: #d63b3b;
    --danger-dim: #f6c9c9;
    --warn: #b8720a;
    --warn-dim: #f3ddb0;
    --busy: #a6870a;
    --busy-dim: #f0e3b0;
    --accent2: #1861b3;
    --accent2-dim: #cfe1f7;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.08);
    --shadow-md: 0 8px 24px -8px rgba(0,0,0,.12);
    --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.16);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  ::selection { background: var(--accent-soft); color: var(--text); }

  body {
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(56,224,123,.06), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(88,166,255,.05), transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    margin: 0; padding: 0 0 80px;
    letter-spacing: -0.006em;
  }

  h1, h2, h3 { font-family: var(--font-sans); letter-spacing: -0.02em; margin-top: 0; font-weight: 700; }
  h2 { font-size: 17px; display: flex; align-items: center; gap: 10px; }
  h3 { font-size: 14px; }
  p { line-height: 1.55; }

  /* ---------- icons ---------- */
  .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: -3px; }
  .icon-sm { width: 14px; height: 14px; }
  .icon-lg { width: 24px; height: 24px; }

  .icon-chip {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    background: var(--accent-soft); color: var(--accent); flex-shrink: 0;
  }
  .icon-chip.blue { background: rgba(88,166,255,.1); color: var(--accent2); }
  .icon-chip.amber { background: rgba(255,179,71,.1); color: var(--warn); }

  /* ---------- header / nav ---------- */
  header {
    position: sticky; top: 0; z-index: 40;
    padding: 14px 28px; border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
    background: var(--header-bg, rgba(20, 24, 22, .82)); backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
  }
  header .brand { display: flex; align-items: center; gap: 12px; }
  header .brand-mark {
    width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
    background: linear-gradient(155deg, var(--accent), #1f8850);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px -4px rgba(56,224,123,.5);
  }
  header .brand-mark .icon { color: #06110a; width: 19px; height: 19px; stroke-width: 2.4; }
  header .brand-text { display: flex; flex-direction: column; gap: 1px; }
  header h1 { font-size: 16.5px; margin: 0; line-height: 1.2; }
  header h1 a { color: var(--text); text-decoration: none; }
  header .tag { color: var(--text-dim); font-size: 12px; letter-spacing: -0.005em; }

  nav.tabs {
    display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--radius-pill);
    background: var(--surface-sunken); border: 1px solid var(--border-soft);
  }
  nav.tabs a {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--text-dim); text-decoration: none; font-size: 13px; font-weight: 600; padding: 8px 15px;
    border-radius: var(--radius-pill); transition: color .15s ease, background .15s ease;
  }
  nav.tabs a .icon { width: 15px; height: 15px; }
  nav.tabs a:hover { color: var(--text); }
  nav.tabs a.active { color: #06110a; background: var(--accent); box-shadow: var(--shadow-sm); }

  main { max-width: 960px; margin: 0 auto; padding: 36px 20px; }

  /* ---------- cards ---------- */
  .card {
    background: linear-gradient(180deg, var(--surface-raised), var(--surface-solid));
    border: 1px solid var(--border-soft); border-radius: var(--radius-lg);
    padding: 26px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }
  .card > h2:first-child { margin-bottom: 10px; }
  .card-flat { background: var(--surface-sunken); border-radius: var(--radius-md); padding: 16px; border: 1px solid var(--border-soft); }

  /* ---------- forms ---------- */
  input[type=text], input[type=url], textarea, select {
    width: 100%; background: var(--surface-sunken); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14.5px; font-family: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type=text]:focus, input[type=url]:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--accent-dim); box-shadow: 0 0 0 4px var(--accent-soft);
  }
  textarea { min-height: 200px; resize: vertical; line-height: 1.6; }

  button, .btn {
    background: var(--accent); color: #06110a; border: none; border-radius: var(--radius-sm); padding: 12px 20px;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    transition: transform .12s cubic-bezier(.2,.8,.2,1), filter .15s ease, box-shadow .15s ease;
    box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, var(--shadow-sm);
  }
  button:hover { filter: brightness(1.07); }
  button:active { transform: scale(.97); }
  button.secondary { background: var(--surface-raised); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
  button.secondary:hover { border-color: var(--accent-dim); color: var(--accent); filter: none; }
  button.ghost { background: transparent; color: var(--text-dim); box-shadow: none; padding: 10px 14px; }
  button.ghost:hover { color: var(--text); filter: none; }
  button.danger-ghost { background: transparent; color: var(--danger); box-shadow: none; border: 1px solid var(--danger-dim); }
  button:disabled { background: var(--border); color: var(--text-faint); cursor: not-allowed; filter: none; box-shadow: none; transform: none; }

  .mode-grid { display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
  .mode-card {
    flex: 1; min-width: 220px; text-align: left; cursor: pointer;
    border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px;
    background: var(--surface-raised); color: var(--text);
    display: flex; flex-direction: column; gap: 10px;
    font-weight: 400; box-shadow: none; transition: border-color .15s ease, transform .12s ease;
  }
  .mode-card:hover { border-color: var(--accent-dim); filter: none; transform: translateY(-2px); }
  .mode-card:active { transform: scale(.98); }
  .mode-card.selected { border-color: var(--accent); }
  .mode-card strong { color: var(--text); font-size: 1.1em; }
  .mode-card .muted { color: var(--text-dim); font-size: .9em; flex: 1; }
  a.mode-card { text-decoration: none; }
  .mode-card-cta {
    display: inline-flex; align-items: center; gap: 6px; color: var(--accent);
    font-size: .85em; font-weight: 700; margin-top: 4px;
    opacity: 0; transform: translateX(-4px); transition: opacity .15s ease, transform .15s ease;
  }
  .mode-card:hover .mode-card-cta { opacity: 1; transform: translateX(0); }
  .mode-card:hover .icon-chip { transform: scale(1.08); }
  .icon-chip { transition: transform .15s ease; }

  .benefits-card { margin-top: 8px; }
  .benefits-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 18px;
  }
  .benefit { display: flex; flex-direction: column; gap: 8px; }
  .benefit strong { color: var(--text); font-size: 1em; }
  .benefit p { margin: 0; }

  /* responsivo: empilha em telas menores */
  @media (max-width: 900px) {
    .mode-grid { flex-direction: column; }
    .benefits-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    header { flex-direction: column; align-items: flex-start; gap: 12px; }
    nav.tabs { flex-wrap: wrap; }
    main { padding: 16px 12px; }
  }

  /* ---------- carrossel de beneficios ---------- */
  .benefits-section { margin-top: 8px; }
  .carousel {
    overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    display: flex; margin-top: 18px; padding-bottom: 6px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .carousel-track { display: flex; gap: 16px; }
  .benefit-card {
    scroll-snap-align: start; flex: 0 0 260px;
    background: linear-gradient(180deg, var(--surface-raised), var(--surface-solid));
    border: 1px solid var(--border-soft); border-radius: var(--radius-lg);
    padding: 22px; display: flex; flex-direction: column; gap: 10px;
    box-shadow: var(--shadow-sm);
  }
  .benefit-card strong { color: var(--text); font-size: 1em; }
  .benefit-card p { margin: 0; color: var(--text-dim); font-size: .9em; }
  .carousel-dots { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .carousel-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--border);
    cursor: pointer; transition: background .15s ease, transform .15s ease;
  }
  .carousel-dot.active { background: var(--accent); transform: scale(1.3); }
  @media (max-width: 600px) {
    .benefit-card { flex-basis: 78vw; }
  }
  a.btnlink {
    display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #06110a; text-decoration: none;
    padding: 12px 20px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, var(--shadow-sm); transition: transform .12s ease, filter .15s ease;
  }
  a.btnlink:hover { filter: brightness(1.07); }
  a.btnlink:active { transform: scale(.97); }

  label { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  .muted { color: var(--text-dim); }
  .faint { color: var(--text-faint); font-size: 12.5px; }

  /* ---------- badges ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: .4rem; font-size: .68rem; text-transform: uppercase;
    letter-spacing: .07em; padding: .3rem .65rem; border-radius: var(--radius-pill); border: 1px solid var(--border);
    color: var(--text-dim); font-weight: 700; background: var(--surface-sunken);
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge[data-status="ok"], .badge[data-status="done"] { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }
  .badge[data-status="err"], .badge[data-status="error"] { color: var(--danger); border-color: var(--danger-dim); background: rgba(255,107,107,.08); }
  .badge[data-status="warn"] { color: var(--warn); border-color: var(--warn-dim); background: rgba(255,179,71,.08); }
  .badge[data-status="busy"] { color: var(--busy); border-color: var(--busy-dim); background: rgba(255,217,61,.08); }
  .badge[data-status="busy"] .dot { animation: pulse 1.1s ease-in-out infinite; }
  .badge[data-status="pending"] { color: var(--text-dim); border-color: var(--border); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .joblist a {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    padding: 16px 18px; border: 1px solid var(--border-soft); border-radius: var(--radius-md);
    margin-bottom: 10px; color: var(--text); text-decoration: none; background: var(--surface-sunken);
    transition: border-color .15s ease, transform .12s ease, background .15s ease;
  }
  .joblist a:hover { border-color: var(--accent-dim); background: var(--surface-raised); transform: translateY(-1px); }
  .joblist .meta { color: var(--text-dim); font-size: 12px; margin-top: 5px; flex-basis: 100%; }
  .joblist .badges { display: flex; gap: 6px; flex-wrap: wrap; }

  pre.log {
    background: #07090850; border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 16px;
    max-height: 320px; overflow-y: auto; font-size: 12px; line-height: 1.6; white-space: pre-wrap;
    font-family: var(--font-mono); color: #b7c2ba;
  }
  video { width: 100%; border-radius: var(--radius-md); background: black; box-shadow: var(--shadow-md); }
  input[type=color] { width: 48px; height: 40px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: none; padding: 3px; cursor: pointer; }

  /* ---------- wizard stepper ---------- */
  .wizard {
    display: flex; align-items: flex-start; gap: 0; margin-bottom: 8px; overflow-x: auto; padding: 4px 2px 10px;
  }
  .wizard-step {
    display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; min-width: 84px;
    cursor: pointer; background: none; border: none; font-family: inherit; position: relative; padding: 0;
  }
  .wizard-step .circle {
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--surface-sunken); border: 2px solid var(--border); color: var(--text-faint);
    transition: all .2s ease; z-index: 1;
  }
  .wizard-step .label { font-size: 11.5px; color: var(--text-faint); font-weight: 600; text-align: center; transition: color .2s ease; }
  .wizard-step .line {
    position: absolute; top: 20px; left: calc(-50% + 20px); width: calc(100% - 40px); height: 2px;
    background: var(--border); z-index: 0;
  }
  .wizard-step:first-child .line { display: none; }
  .wizard-step.done .circle { background: var(--accent); border-color: var(--accent); color: #06110a; }
  .wizard-step.done .label { color: var(--text-dim); }
  .wizard-step.done .line { background: var(--accent-dim); }
  .wizard-step.active .circle { border-color: var(--accent2); color: var(--accent2); box-shadow: 0 0 0 5px var(--accent2-dim); transform: scale(1.06); }
  .wizard-step.active .label { color: var(--text); }
  .wizard-step.err .circle { border-color: var(--danger); color: var(--danger); }
  .wizard-step.err .label { color: var(--danger); }
  .wizard-step .circle .icon { width: 17px; height: 17px; }

  .phase-screen { display: none; animation: fadein .25s ease; }
  .phase-screen.visible { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .phase-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-soft); }

  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .section-head .title { display: flex; align-items: center; gap: 12px; }
  .section-head .title-text { display: flex; flex-direction: column; gap: 2px; }
  .section-head .title-text .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 700; }
  .section-head h2 { margin: 0; }

  .thumbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
  .thumbcard {
    background: var(--surface-raised); border: 1px solid var(--border-soft); border-radius: var(--radius-md); overflow: hidden;
    transition: transform .15s ease, border-color .15s ease; box-shadow: var(--shadow-sm);
  }
  .thumbcard:hover { transform: translateY(-2px); border-color: var(--accent-dim); }
  .thumbcard img, .thumbcard .noimg {
    width: 100%; aspect-ratio: 9/16; object-fit: cover; background: var(--surface-sunken); display: block;
  }
  .thumbcard .noimg { display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 12px; flex-direction: column; gap: 8px; }
  .thumbcard .body { padding: 12px 14px; }
  .thumbcard .name { font-size: 12.5px; word-break: break-word; margin-bottom: 6px; font-weight: 600; }
  .thumbcard .meta { color: var(--text-dim); font-size: 11px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .thumbcard .roteiro-preview { color: var(--text-dim); font-size: 11.5px; margin-top: 8px; max-height: 3.2em; overflow: hidden; line-height: 1.5; }

  .rail-scroll { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .rail-scroll::-webkit-scrollbar { height: 6px; width: 8px; }
  .rail-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-pill); }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }
  .empty-state .icon { width: 32px; height: 32px; color: var(--text-faint); margin-bottom: 10px; }

  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-dim); text-decoration: none; font-size: 13px; font-weight: 600; margin-bottom: 4px; transition: color .15s; }
  .back-link:hover { color: var(--text); }

  /* ---------- live timers ---------- */
  .timer {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12.5px;
    font-weight: 600; color: var(--busy); background: rgba(255,217,61,.08); border: 1px solid var(--busy-dim);
    padding: 5px 11px; border-radius: var(--radius-pill); white-space: nowrap;
  }
  .timer .icon { width: 13px; height: 13px; animation: spin 2s linear infinite; }
  .timer.done { color: var(--text-dim); background: var(--surface-sunken); border-color: var(--border); }
  .timer.done .icon { animation: none; }
  .timer .timer-label { text-transform: uppercase; letter-spacing: .04em; font-size: 10.5px; color: inherit; opacity: .85; font-family: var(--font-sans); }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ---------- color swatches (live preview) ---------- */
  .swatch {
    width: 100%; height: 46px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    margin-top: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .swatch-caption {
    margin-top: 10px; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--surface-sunken);
    border: 1px solid var(--border); font-weight: 700; font-size: 14px; text-align: center;
  }
  .color-field { display: flex; align-items: center; gap: 10px; }
  .color-field input[type=color] { flex-shrink: 0; }
  .color-field .hex { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }

  /* ---------- repo analysis stat chips ---------- */
  .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
  .statchip {
    display: flex; align-items: center; gap: 10px; background: var(--surface-sunken); border: 1px solid var(--border-soft);
    border-radius: var(--radius-md); padding: 14px 16px;
  }
  .statchip .icon-chip { width: 32px; height: 32px; border-radius: var(--radius-sm); }
  .statchip .val { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .statchip .lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }

  /* ---------- landing hero ---------- */
  .hero { text-align: center; padding: 48px 24px 40px; }
  .hero .eyebrow-pill {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); border: 1px solid var(--accent-dim); padding: 6px 14px; border-radius: var(--radius-pill);
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 20px;
  }
  .hero h1.hero-title { font-size: 34px; line-height: 1.15; letter-spacing: -0.03em; margin: 0 auto 14px; max-width: 640px; }
  .hero p.hero-sub { font-size: 15.5px; color: var(--text-dim); max-width: 520px; margin: 0 auto; line-height: 1.6; }
  @media (max-width: 620px) { .hero h1.hero-title { font-size: 27px; } }

  .flow-strip { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 30px; flex-wrap: wrap; }
  .flow-node {
    display: flex; align-items: center; gap: 8px; background: var(--surface-sunken); border: 1px solid var(--border-soft);
    border-radius: var(--radius-pill); padding: 9px 16px; font-size: 12.5px; font-weight: 600; color: var(--text-dim);
  }
  .flow-node .icon-chip { width: 24px; height: 24px; border-radius: 50%; }
  .flow-arrow { color: var(--text-faint); }
</style>
</head>
